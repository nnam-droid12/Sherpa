[project]
name = "sherpa-agent"
version = "0.1.0"
description = "Sherpa backend: audit, fix, verify and agent-ready PayPal checkout integrations"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "google-genai>=1.30",
  "google-cloud-firestore>=2.18",
  "playwright>=1.47",
  "kernel>=0.8",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "respx>=0.21"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sherpa*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits real external services (opt-in with SHERPA_LIVE_TESTS=1)"]
